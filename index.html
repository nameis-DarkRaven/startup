<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duck-io HTML</title>
    <!-- <link rel="icon" href="favicon.ico" /> -->
  </head>
  <body style="background:url(https://random-d.uk/api/randomimg); background-repeat:no-repeat; background-size:cover; width:100%; height:100%">
    <!-- style="background-color: rgb(148, 110, 162)" -->
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header style="color: white">
      <!-- <input type="text" size="20 px" value="Duck-io &reg;" style="background-color: white;" readonly> -->
      <h1>Duck-io<sup>&reg;</sup></h1>
    <!-- </input> -->
      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="click.html">Click Ducks</a></li>
          <li><a href="about.html">About</a></li>
        </menu>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <h1 style="color: white">Welcome Back!</h1>
      <form method="get" action="click.html">
        <div>
          <input type="text" placeholder="your@email.com" />
        </div>
        <div>
          <input type="password" placeholder="password" />
        </div>
        <button type="submit">Login</button>
        <button type="submit">Register</button>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Emilee Forbush</span>
      <br />
      <a href="https://github.com/webprogramming260/simon-html">GitHub</a>
    </footer>
  </body>
</html>
